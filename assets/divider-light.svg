<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset="0.5" stop-color="#0969da"/>
      <stop offset="0.75" stop-color="#8250df"/><stop offset="1" stop-color="#bf3989" stop-opacity="0"/>
      <animate attributeName="x1" values="-500;500" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1000" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="#eaeef2"/>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#line)"/>
</svg>
