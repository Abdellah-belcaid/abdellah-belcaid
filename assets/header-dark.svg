<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Abdellah Belcaid, Full-Stack Software Engineer</title>
  <desc id="desc">Full-stack engineer @ Norsys Africa. Java · Spring Boot · React · Angular. From the first commit to production. Marrakech, Morocco, 2+ years of experience.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.35" stop-color="#a371f7"/>
      <stop offset="0.7" stop-color="#f778ba"/><stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#d2a8ff"/><stop offset="1" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0;520;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="520;1040;520" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern>
    <clipPath id="card"><rect x="2" y="2" width="996" height="296" rx="18"/></clipPath>
    <clipPath id="type1"><rect x="48" y="168" height="32" width="0">
      <animate id="t1" attributeName="width" values="0;458;458;0" keyTimes="0;0.35;0.85;1" dur="4s" begin="0s;t3.end" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="48" y="168" height="32" width="0">
      <animate id="t2" attributeName="width" values="0;458;458;0" keyTimes="0;0.35;0.85;1" dur="4s" begin="t1.end" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="48" y="168" height="32" width="0">
      <animate id="t3" attributeName="width" values="0;458;458;0" keyTimes="0;0.35;0.85;1" dur="4s" begin="t2.end" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
    </rect></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .narrow { display: none; }
    @media (max-width: 640px) { .wide { display: none; } .narrow { display: inline; } }
    @keyframes l0 { 0%, 2% { opacity: 0 } 4%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l1 { 0%, 9% { opacity: 0 } 11%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l2 { 0%, 16% { opacity: 0 } 18%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l3 { 0%, 23% { opacity: 0 } 25%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l4 { 0%, 30% { opacity: 0 } 32%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l5 { 0%, 37% { opacity: 0 } 39%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l6 { 0%, 44% { opacity: 0 } 46%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes l7 { 0%, 51% { opacity: 0 } 53%, 92% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes r0 { 0% { opacity: 0 } 3.0% { opacity: 1 } 30.3% { opacity: 1 } 33.333333333333336% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes r1 { 0% { opacity: 0 } 33.333333333333336% { opacity: 0 } 36.3% { opacity: 1 } 63.7% { opacity: 1 } 66.66666666666667% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes r2 { 0% { opacity: 0 } 66.66666666666667% { opacity: 0 } 69.7% { opacity: 1 } 97.0% { opacity: 1 } 100% { opacity: 0 } 100% { opacity: 0 } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .float { opacity: 0; animation: float 9s ease-in-out infinite; }
    @keyframes float { 0% { opacity: 0; transform: translateY(20px) } 20%, 80% { opacity: .22 } 100% { opacity: 0; transform: translateY(-60px) } }
    .glow { animation: pulse 7s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 0.35 } to { opacity: 0.7 } }
    .live { animation: live 1.6s ease-out infinite; transform-origin: 66px 254px; }
    @keyframes live { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(2.6); opacity: 0 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0d1117"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <circle class="glow" cx="170" cy="60" r="140" fill="#1f6feb" filter="url(#blur)"/>
    <circle class="glow" cx="860" cy="270" r="150" fill="#8957e5" filter="url(#blur)" style="animation-delay:-3s"/>
    <g class="mono" font-size="20" fill="#58a6ff">
      <text class="float" x="430" y="80">{ }</text>
      <text class="float" x="520" y="250" style="animation-delay:-2s">&lt;/&gt;</text>
      <text class="float" x="300" y="270" style="animation-delay:-4s">=&gt;</text>
      <text class="float" x="960" y="60" style="animation-delay:-6s">@</text>
      <text class="float" x="470" y="150" style="animation-delay:-7.5s">;</text>
    </g>
  </g>
  <rect x="2" y="2" width="996" height="296" rx="18" fill="none" stroke="url(#border)" stroke-width="2.5"/>

  <g class="wide">
    <text class="mono" x="48" y="78" font-size="17" fill="#8b949e">Hi there, I'm</text>
    <text class="sans" x="46" y="138" font-size="50" font-weight="700" fill="url(#name)">Abdellah Belcaid</text>
    <g class="mono" font-size="19">
    <text x="48" y="190" clip-path="url(#type1)"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">Full-stack engineer @ Norsys Africa</tspan></text>
    <text x="48" y="190" clip-path="url(#type2)"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">Java · Spring Boot · React · Angular</tspan></text>
    <text x="48" y="190" clip-path="url(#type3)"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">From the first commit to production</tspan></text>
    </g>
    <circle class="live" cx="66" cy="254" r="5" fill="#3fb950"/>
    <circle cx="66" cy="254" r="5" fill="#3fb950"/>
    <text class="sans" x="80" y="259" font-size="15" fill="#8b949e">Marrakech, Morocco  ·  2+ years in production code</text>

    <g transform="translate(560 32)">
      <rect width="404" height="236" rx="10" fill="#161b22" stroke="#30363d"/>
      <rect width="404" height="30" rx="10" fill="#1c2128"/>
      <rect y="20" width="404" height="10" fill="#1c2128"/>
      <circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/>
      <text class="mono" x="202" y="19" font-size="12" fill="#8b949e" text-anchor="middle">abdellah@dev: ~</text>
      <g class="mono" font-size="14">
      <text x="16" y="56" style="opacity:0;animation:l0 14s infinite"><tspan fill="#3fb950">~ $</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
      <text x="16" y="79" style="opacity:0;animation:l1 14s infinite"><tspan fill="#8b949e">abdellah belcaid, full-stack engineer</tspan></text>
      <text x="16" y="102" style="opacity:0;animation:l2 14s infinite"><tspan fill="#3fb950">~ $</tspan><tspan fill="#c9d1d9"> cat stack.txt</tspan></text>
      <text x="16" y="125" style="opacity:0;animation:l3 14s infinite"><tspan fill="#8b949e">java · spring boot · react · angular</tspan></text>
      <text x="16" y="148" style="opacity:0;animation:l4 14s infinite"><tspan fill="#3fb950">~ $</tspan><tspan fill="#c9d1d9"> ./now.sh</tspan></text>
      <text x="16" y="171" style="opacity:0;animation:l5 14s infinite"><tspan fill="#58a6ff">●</tspan><tspan fill="#8b949e"> work: offline-first agri app</tspan></text>
      <text x="16" y="194" style="opacity:0;animation:l6 14s infinite"><tspan fill="#d2a8ff">●</tspan><tspan fill="#8b949e"> side: tadlalt e-commerce (private)</tspan></text>
      <g style="opacity:0;animation:l7 14s infinite">
        <text x="16" y="217" fill="#3fb950">~ $</text>
        <rect class="cursor" x="50" y="206" width="8" height="15" fill="#c9d1d9"/>
      </g>
      </g>
    </g>
  </g>

  <g class="narrow">
    <text class="sans" x="500" y="138" font-size="74" font-weight="700" fill="url(#name)" text-anchor="middle">Abdellah Belcaid</text>
    <text class="mono" x="500" y="206" font-size="36" text-anchor="middle" style="opacity:0;animation:r0 12s infinite"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">Full-stack engineer @ Norsys Africa</tspan></text>
    <text class="mono" x="500" y="206" font-size="36" text-anchor="middle" style="opacity:0;animation:r1 12s infinite"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">Java · Spring Boot · React · Angular</tspan></text>
    <text class="mono" x="500" y="206" font-size="36" text-anchor="middle" style="opacity:0;animation:r2 12s infinite"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#c9d1d9">From the first commit to production</tspan></text>
    <text class="sans" x="500" y="264" font-size="28" fill="#8b949e" text-anchor="middle"><tspan fill="#3fb950">● </tspan>Marrakech  ·  2+ years</text>
  </g>
</svg>
