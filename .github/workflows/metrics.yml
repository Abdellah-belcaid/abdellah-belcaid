name: Generate Profile Assets

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 2am UTC
  workflow_dispatch:        # Also runnable manually from the Actions tab
  push:
    branches: [main]

jobs:

  # ─── Job 1: GitHub Stats Cards ────────────────────────────────────────────
  github-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Stats card (general)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          user: abdellah-belcaid
          base: header, activity, community, repositories
          config_timezone: Africa/Casablanca

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-langs.svg
          user: abdellah-belcaid
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, makefile, cmake
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          config_timezone: Africa/Casablanca

  # The contribution snake is generated by snake.yml only: two workflows pushing
  # to the same "output" branch at once made one of them fail.
