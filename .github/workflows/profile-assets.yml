name: Profile assets

# Rebuilds assets/*.svg (header, timeline, certifications, LeetCode card) from data/profile.json:
# weekly to refresh dynamic values (years of experience, LeetCode numbers), and whenever the
# data or the build script changes.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC
  push:
    branches: [main]
    paths:
      - data/profile.json
      - scripts/**
      - .github/workflows/profile-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build images
        run: node scripts/build-assets.mjs

      # The build is deterministic, so there is only something to commit when a value really changed.
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          git commit -m "chore: refresh profile assets"
          git push
